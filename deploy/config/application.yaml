# =============================================================================
# EKBS 主配置 —— /opt/ekbs/etc/application.yaml
# -----------------------------------------------------------------------------
# 【本文件是**非敏感**配置】
#   敏感项（各类 API Key、钉钉 AppSecret、JWT 密钥、内部回环 Token）**一律不写在这里**，
#   它们只存在于 ~/.ekbs/secrets.env（权限 600，见 deploy/config/secrets.env.example），
#   由 launchd 的 `zsh -lc 'set -a; source …; set +a; exec …'` 在进程启动时注入。
#   ekbs/config.py 对 application.yaml 做反向检查：一旦发现密钥类键名即直接报错退出
#   （04 §2.6）。因此不要在本文件里用 ${VAR} 占位 —— 那只会诱导后人填明文。
#
# 【权威来源】
#   app / server / database / retrieval / models / parse / permission 段与 dingtalk 段原有键：
#       01-实施步骤与本地部署.md §7（逐字）
#   dingtalk 段补齐键 + adapter / session / limits / security 段：
#       04-钉钉接入方案.md §5.2（逐字）
#
# 【生效方式】改本文件后需重启对应进程：
#   launchctl kickstart -k gui/$(id -u)/com.ekbs.api   （其余服务同理，见 01 §16）
# =============================================================================

app:
  name: ekbs
  env: pilot
  timezone: Asia/Shanghai
  log_dir: /opt/ekbs/log
  data_dir: /data/ekbs

server:
  host: 127.0.0.1          # 仅本机监听；对外由反向代理（§9）
  port: 8000
  # 必须为 1：权限缓存的进程内 L1 靠同进程同步失效，多 worker 会出现 ≤300s 的旧权限窗口。
  # 详细理由与多进程逃生通道见 04 §1.5 与 04 §4.6。CPU 并行由 asyncio.to_thread + FAISS 承担。
  workers: 1

database:
  path: /data/ekbs/index/ekbs.db
  wal: true

# ---------- 检索链路参数（对应 00 §2.1）----------
retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  multi_query: 3            # 稀疏侧多查询（词面变体）
  # 稠密侧多查询（1=关）。**待完整语料 A/B 通过再开**：会改变检索结果与答案缓存版本。
  dense_multi_query: 1
  rerank:
    enabled: true          # 开关；实测后可关闭
    provider: dashscope
    # 2026-09-27 依实测定稿（原 gte-rerank-v2：官方公告 2026-05-30 下线且命名有歧义）
    model: qwen3.7-text-rerank
    top_n: 15              # 输入候选数（原 30 已减半）
    keep: 5                # 输出条数
    # 三带实测校准。第一次用 demo 语料（2 文档）取 0.60；**2026-10-02 已用 16 份真实语料重做**：
    #   正例 28 题 top 分 min 0.583 / P10 0.774 / 中位 0.980；负例 8 题 min 0.273 / 中位 0.326 / max 0.608
    #   两带重叠 → 单一阈值无干净分界；0.60 会漏放 1 条负例（误答），0.65 两者皆 0/1（漏放 0、误拒 1）。
    # 故 **0.65**。完整实测与逐阈值对照见 config/application.cloud.yaml 同字段注释
    # 与 python -m ekbs.tools.eval_switch_sweep。
    min_score: 0.65        # 低于此分视为无有效命中 → 拒答
    # 多子问（P2）配额：每子问保底块数 / 多子问最终 keep 上限
    per_question_min: 1
    keep_cap: 15
  parent_expand: true
  # 多意图拆分（P0）：一次问多个问题时拆成子问，每子问独立召回 + 配额精排
  # rules=确定性规则（离线可测）；llm 在 batch 1 暂按 rules 兜底（待接线）
  intent_split:
    enabled: true
    strategy: rules
    max_questions: 5
  # 融合：rrf | alpha（α·向量+(1-α)·BM25）。**原来这里没有这个键**，会落到配置类默认的 rrf，
  # 而 2026-10-02 用 16 份真实语料 + 两套金标题集实测：rrf 在同义改写集上 82.4%/0.657，
  # alpha 0.85 → 88.2%/0.664，纯向量 → 94.1%/0.683（RRF 把很弱的稀疏侧与向量侧同等加权）。
  # 取 0.85 保留 15% 词法权重作为"精确编号/金额"类查询的保险。依据见 README §四 第 75 条。
  fusion: alpha
  hybrid_alpha: 0.75
  # 仅电子表格（xlsx/xls/xlsm）一行一个块、表头每块重复（RAGFlow 口径）；
  # Word/PDF/PPT 一律按 384 token 行组叶子（来源判定在 ingest/chunker.py）。
  table_row_chunks: true
  cache:
    # 本栈无 Redis：L1 为进程内 LRU，L2 为 SQLite 表 ekbs_cache（键必须含 perm_fingerprint）
    backend: memory+sqlite
    l1_size: 2000                # 进程内 LRU 条目数
    query_embedding_ttl: 86400   # 查询嵌入缓存（必需项，见 00 §2.3；与权限无关，可全局共享）
    retrieve_ttl: 1800           # 检索结果缓存（键含 perm_fingerprint，见 00 §3.4）
    answer_ttl: 3600             # 答案缓存（键含 perm_fingerprint）

# ---------- 云端模型 ----------
models:
  embed:
    provider: dashscope
    # 2026-09-27 依实测定稿（原 text-embedding-v4）：115ms、0.000125 元/千 token、
    # RPM 24000（v4 仅 1800）、上下文 128K；维度 1024 与本地备选 bge-m3 同维，便于迁移。
    model: qwen3.7-text-embedding-flash
    dim: 1024              # 与本地备选 bge-m3 同维，便于迁移
    # 单请求上限**按模型不同**：v4/v3=10、本模型=20（已实测）。换模型必须同步改。
    # 官方最大行数 20（单行最大 128,000 token）；运行取 16 留余量，不顶满
    batch_size: 16
    # 查询/文档**不对称编码**（DashScope text_type）：查询发 query、入库发 document。
    # 实测该参数生效（document 与默认向量余弦 0.916），但**开启会改变全部 chunk 向量**：
    # 必须全量重灌；指纹会自动带上 `+asym`，避免新旧向量混用（C3 禁止混用向量）。
    # 采用前应先用金标题集 A/B（Hit@5 / MRR）证明有效，再全量重建。
    asymmetry: false
    timeout_s: 30
    max_retries: 3
  llm:
    provider: dashscope
    # 2026-11-06 切换：DeepSeek V4.1 Flash（DashScope 兼容端点）。
    # A/B 实测 p50 ~1.97s vs qwen-max ~4.19s；生产 key 用 DASHSCOPE_API_KEY。
    model: deepseek-v4.1-flash
    # 关闭思考：默认思考模式会显著拉长首 token，且长答案易撞 max_tokens 被截断。
    reasoning_effort: none
    temperature: 0.1
    top_p: 0.8
    max_tokens: 2048
    # 输入上限：模型窗口 30,720，本地 Qwen 计数 × 最坏偏差 1.19 ⇒ 取 20,000
    # （云端约 23.8k，留 ~23% 余量）。超预算时的裁剪优先级：最旧轮次 → 排名最低的块 → 截断。
    max_input_tokens: 20000
    timeout_s: 120
    max_retries: 2
    fallback:              # 主模型不可用时启用（见 00 §2.3）
      provider: deepseek
      model: deepseek-chat

# ---------- 解析 ----------
parse:
  # 生产默认关闭：会计费且把图片发到云端，确认合规后再开
  figure_caption: false
  engine: mineru
  max_file_mb: 500
  timeout_s: 1800
  worker_concurrency: 1    # 16 GB 机器：解析串行，避免内存峰值叠加
  keep_tmp_days: 7

# ---------- 权限 ----------
permission:
  default_level: 2
  l4_enabled: true         # 2026-10-09 用户确认（测试期）：全部闸门打开
  l3_ingest_enabled: true  # 2026-10-09 用户确认（测试期）：L3 允许入库
  policy_cache_ttl: 300
  # 合规闸：云端嵌入 = 全量语料出网。书面确认前保持 false（00 §7）
  corpus_egress_ack: true  # 2026-10-09 用户确认（测试期）
  corpus_egress_ack_ticket: "2026-10-09 用户确认：测试期全部闸门打开（合规书暂缓）"   # 书面确认编号 / 链接，便于审计

# ---------- 钉钉（凭据在 secrets.env）----------
# 01 §7 原有键 + 04 §5.2 补齐键；本节是 04 §5.2 与 01 §7 的合并结果
dingtalk:
  stream_enabled: true
  per_user_session: true   # 群聊会话按用户隔离（见 04 §5.5）
  rate_limit_per_user_per_min: 20
  max_reply_chars: 3500    # 单条回复字符上限；超出则截断并改为卡片分段（04 §5.8）
  reconnect_backoff_seconds: [3, 5, 10, 20, 30]   # Stream 断线重连退避序列（秒），耗尽后回到首个间隔
  heartbeat_ping_seconds: 60                      # 应用层心跳间隔；须小于企业代理的空闲超时（01 §11）
  ack_timeout_seconds: 10                         # 收到消息后必须 ACK 的时限，超时钉钉侧会认定投递失败
  # robot_code 只在这里定义一处：它是「机器人身份」，不是 HTTP 传输参数，
  # 因此不放进 openapi 段（04 §6.5 的代码读 settings.dingtalk["robot_code"]）
  robot_code: "dingxxxxxxxx"               # 机器人编码（非敏感，见 04 §2.6）
  openapi:
    base_url: "https://api.dingtalk.com"           # 新版 OpenAPI（卡片、机器人、通讯录 v3）
    legacy_base_url: "https://oapi.dingtalk.com"   # 旧版 OpenAPI（gettoken、user/getuserinfo）
    connect_timeout: 3.0
    read_timeout: 5.0
    max_retries: 2
    token_cache_key: "ekbs:dt:app_token:{app_key}"  # access_token 在 ekbs_cache 中的键模板
    token_refresh_ahead_seconds: 300                # 提前 300s 刷新，避免临界过期
  card:
    ai_template_id: "dingxxxxxxxx"        # AI 答案卡片模板 ID（非敏感，见 §2.6）
    citation_template_id: "dingxxxxxxxx"  # 引用来源卡片模板 ID
    streaming_enabled: true
    streaming_chunk_chars: 24        # 累积 24 字符推送一次
    streaming_min_interval_ms: 300   # 最小推送间隔
    streaming_max_duration_seconds: 120
    thinking_text: "正在检索企业知识库…"

# ---------- 钉钉适配器进程（04 §5.2）----------
adapter:
  host: 127.0.0.1                    # 仅本机监听；对外由 Caddy 终结 TLS（01 §9）
  port: 8100
  graceful_shutdown_seconds: 30      # 优雅退出：等在途消息处理完
  api_base: "http://127.0.0.1:8000"  # 回环调用 ekbs-api（见 §1.5 跳 (3)）
  qa_stream_timeout_seconds: 180
  request_timeout_seconds: 30
  # 首次会话的自我介绍（每个用户只发一次：首次私聊 / 首次在群被 @ 都算）；置空 = 关闭
  self_intro: |-
    你好，我是企业知识库助手。
    你可以直接问制度、合同、表格里的具体条款；也可以发送「帮助」

# ---------- 多轮会话（04 §5.2；落库表 ekbs_session_ctx，见 01 §5.5）----------
session:
  context_max_turns: 10               # 多轮上下文最多保留 6 轮
  context_ttl_seconds: 604800          # 会话 2 小时过期（按 ekbs_session_ctx.updated_at 判定）
  group_share_context: false         # 群聊不共享上下文（默认）

qa:
  auto_numeric: false                 # auto 一律 prose；取数只由显式 mode=numeric 触发
  # 规则计划未命中时，允许模型只输出结构化计算计划（不输出数字）
  llm_plan: true

# ---------- 限流与输入闸门（04 §5.2）----------
# ---------- 上传行为（05 §6.5）----------
upload:
  chunk_size_mb: 8
  concurrent: 3
  max_retry: 3

limits:
  global_qps: 20
  per_user_qps: 2
  per_conversation_qps: 3
  max_question_chars: 2000
  max_file_size_mb: 500              # 与方案 §6.5 / parse.max_file_mb 对齐
  personal_storage_mb: 1024          # 每个用户私有库总容量
  file_ext_whitelist: [pdf, docx, doc, pptx, ppt, xlsx, xls, txt, md, html, png, jpg, jpeg]

# ---------- 内容安全（04 §5.2 + §6.4）----------
security:
  allowed_file_mime:                 # 与 file_ext_whitelist 双重校验：扩展名可伪造，MIME 也要看
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain
    - text/markdown
    - image/png
    - image/jpeg
  sensitive_words_path: "/opt/ekbs/etc/sensitive_words.txt"   # L1 敏感词库（pyahocorasick AC 自动机，支持热加载）
  content_security_enabled: true
  # ---- 本机账号登录（管理台第二种登录方式；见 ekbs/local_auth.py）----
  # 日常用钉钉免登；本机账号只在「人就在服务器前 / 钉钉不可用」时兜底。
  local_login_enabled: true          # 关掉后 /auth/local-login 直接 404
  local_login_allow_remote: false    # ⚠️ 保持 false：true = 内网任何机器都能试密码（不推荐）
  local_login_max_failures: 5        # 连续失败次数上限
  local_login_lock_minutes: 15       # 达到上限后的锁定时长

# 生成后置「资料充分性」核验（默认关闭；只对 rerank 边界分调用）
# 选型见公开基准评测报告 §6.5：显式模型 deepseek-flash + reasoning_effort=high，
# 密钥从环境变量 DEEPSEEK_API_KEY 读（secrets.env），不写进本文件。
answer_verify:
  enabled: false
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-flash
  key_env: DEEPSEEK_API_KEY
  reasoning_effort: high
  max_tokens: 4000
  timeout_seconds: 180
  max_retries: 3
  min_score: 0.65
  max_score: 0.85
  max_contexts: 5
  max_context_chars: 900
  fail_open: true

# 分段索引（方案 B）开关：默认 single = 现有单文件行为；灰度时改 segmented。
# P0 只落盘格式与迁移工具，检索路径暂不切换（P1 再接活跃段/跨段归并）。
index:
  layout: single
  writer: worker
  segment:
    batch_max_vectors: 12000
    personal_max_vectors: 1
    idle_flush_seconds: 5
    compaction_max_segments: 8
    compaction_personal_min_segments: 4
