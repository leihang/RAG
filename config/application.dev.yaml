# =============================================================================
# EKBS 开发机配置（对应 01 §7 的 /opt/ekbs/etc/application.yaml）
# -----------------------------------------------------------------------------
# 本文件**只用于开发机**，与生产配置的差异仅有两类，且都以「开发」注释标出：
#   ① 目录：data_dir / log_dir / database.path 指向仓库内 var/，不碰 /opt 与 /data
#       （生产：/opt/ekbs/log、/data/ekbs、/data/ekbs/index/ekbs.db）
#   ② 模型 provider：用 mock 让全链路离线可跑；拿到云端 key 后按注释一行切回 dashscope
#
# 【密钥纪律】本文件是**非敏感**配置：任何 key / secret / token 都不得写在这里。
#   ekbs/config.py 会做反向检查，发现密钥类键名即报错退出（04 §2.6）。
#   云端 key 放 ~/.ekbs/secrets.env（权限 600），或开发机上用环境变量注入。
# =============================================================================

app:
  name: ekbs
  env: dev                 # 开发
  timezone: Asia/Shanghai
  log_dir: var/log         # 开发（生产 /opt/ekbs/log）
  data_dir: var            # 开发（生产 /data/ekbs）

server:
  host: 127.0.0.1
  port: 8000
  # 必须为 1：权限缓存的进程内 L1 靠同进程同步失效（04 §1.5 / §7.2）
  workers: 1

database:
  path: var/index/ekbs.db  # 开发（生产 /data/ekbs/index/ekbs.db）
  wal: true

# ---------- 检索链路参数（对应 00 §2.1；数值与生产一致，改的是 provider 不是参数）----------
retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  rerank:
    enabled: true
    provider: mock         # 开发（生产 dashscope / qwen3.7-text-rerank）
    model: mock-rerank-v1
    top_n: 15
    keep: 5
    min_score: 0.30
    # 多子问（P2）配额：每子问保底块数 / 多子问最终 keep 上限
    per_question_min: 1
    keep_cap: 15
  parent_expand: true
  # 与生产一致（README §七：dev 与生产的检索参数逐字一致，只差 provider）。
  # 选 alpha/0.85 的实测依据见 config/application.cloud.yaml 同字段注释（README §四 第 75 条）。
  fusion: alpha
  hybrid_alpha: 0.85
  doc2query_enabled: true
  doc2query_max: 4
  multi_query: 3
  # 稠密侧多查询数（1=关）。离线/mock：保持原行为
  dense_multi_query: 1
  # figure 多模态旁路：默认关。图片只作文字分片附件，不进向量召回。
  figure_multimodal: false
  # **仅电子表格**（与 cloud/deploy 对齐）：一行一块；月份宽表 melt 成 tidy 长叶子。
  # 缺此键时默认 false → 开发机验收题「9月谁更高」不会走月份熔断路径。
  table_row_chunks: true
  # 无显式年列时不从文件名推断年份（安全默认）；见 README 发现 94。
  month_series_infer_year_from_filename: false
  # B 型收费明细：大表叶子抽样进 FAISS，全量行写观测表做 SUM/COUNT。
  table_leaf_policy: auto
  table_leaf_sample_max: 64
  table_leaf_sample_min_rows: 200
  # 多意图拆分（P0）：一次问多个问题时拆成子问，每子问独立召回 + 配额精排
  intent_split:
    enabled: true
    strategy: rules         # rules（确定性）| off；llm 暂按 rules 兜底
    max_questions: 5
  # 查询改写（00 §2.1 的第一步，多轮对话时启用）；策略：off | heuristic | llm
  # heuristic：含指代 / 追问展开用语（详细、继续…）/ 过短时并入上一轮问题
  query_rewrite:
    strategy: heuristic
  cache:
    backend: memory+sqlite
    l1_size: 2000
    query_embedding_ttl: 86400
    retrieve_ttl: 1800
    answer_ttl: 3600

# ---------- 云端模型 ----------
models:
  embed:
    provider: mock         # 开发（生产 dashscope / qwen3.7-text-embedding-flash）
    model: mock-embed-v1
    dim: 1024
    # ⚠️ 10 而非 01 §7 写的 20：text-embedding-v4 单请求上限就是 10 条，
    #    传 20 会得到 400 batch size is invalid（已核实官方文档，见 docs/spec/40-cloud-models.md）。
    batch_size: 10
    timeout_s: 30
    max_retries: 3
  multimodal_embed:
    provider: mock         # 开发（生产 dashscope / tongyi-embedding-vision-plus @1152）
    model: mock-mm-embed-v1
    dim: 64
    timeout_s: 60
  llm:
    provider: mock         # 开发（生产 dashscope / qwen-max）
    model: mock-llm-v1
    temperature: 0.1
    top_p: 0.8
    max_tokens: 2048
    # 输入上限：模型窗口 30,720，本地 Qwen 计数 × 最坏偏差 1.19 ⇒ 取 20,000
    # （云端约 23.8k，留 ~23% 余量）。超预算时的裁剪优先级：最旧轮次 → 排名最低的块 → 截断。
    max_input_tokens: 20000
    timeout_s: 120
    max_retries: 2
    fallback:              # 主模型不可用时启用（00 §2.3）；开发环境无 fallback
      provider: ""
      model: ""

# ---------- 解析 ----------
parse:
  # 开发环境用 mock 模型，视觉描述不启用
  figure_caption: false
  engine: mineru
  max_file_mb: 500
  timeout_s: 1800
  worker_concurrency: 1
  keep_tmp_days: 7

# ---------- 权限 ----------
permission:
  default_level: 2
  l4_enabled: true             # 2026-10-09 用户确认（测试期）：全部闸门打开
  l3_ingest_enabled: true      # 2026-10-09 用户确认（测试期）：L3 允许入库
  policy_cache_ttl: 300
  # 合规闸（00 §7）：云端嵌入 = 全量语料出网。书面确认前保持 false，仅允许合成语料。
  corpus_egress_ack: true      # 2026-10-09 用户确认（测试期）
  corpus_egress_ack_ticket: "2026-10-09 用户确认：测试期全部闸门打开（合规书暂缓）"
  # dept_code → 钉钉部门 ID 列表 的映射。见 docs/spec/10 的 O6-1 / K1：
  # 权威方案未定义该映射存在哪里，本骨架先由配置承载（不新增 Schema）。
  # ⚠️ 必须放在**配置**里而不是进程内存里：入库（worker）、路由（api）是两个进程，
  #    内存态映射会让同一部门在不同进程里解析出不同的分片名（实测踩过：kb_hr_L2 vs kb_102_L2）。
  #    O6-1 定稿后应迁到权威位置，并同步方案文档。
  dept_code_map:
    hr: ["102"]
    finance: ["103"]

# ---------- 钉钉（开发环境关闭；凭据走 secrets.env）----------
dingtalk:
  stream_enabled: false    # 开发：不连钉钉 Stream，adapter 不启动
  per_user_session: true
  rate_limit_per_user_per_min: 20
  max_reply_chars: 3500
  reconnect_backoff_seconds: [3, 5, 10, 20, 30]
  heartbeat_ping_seconds: 60
  ack_timeout_seconds: 10
  robot_code: "dingdevplaceholder"
  openapi:
    base_url: "https://api.dingtalk.com"
    legacy_base_url: "https://oapi.dingtalk.com"
    connect_timeout: 3.0
    read_timeout: 5.0
    max_retries: 2
    token_cache_key: "ekbs:dt:app_token:{app_key}"
    token_refresh_ahead_seconds: 300
  card:
    ai_template_id: "dingdevplaceholder"
    citation_template_id: "dingdevplaceholder"
    streaming_enabled: true
    streaming_chunk_chars: 24
    streaming_min_interval_ms: 300
    streaming_max_duration_seconds: 120
    thinking_text: "正在检索企业知识库…"

adapter:
  host: 127.0.0.1
  port: 8100
  graceful_shutdown_seconds: 30
  api_base: "http://127.0.0.1:8000"
  qa_stream_timeout_seconds: 180
  request_timeout_seconds: 30
  # 首次会话的自我介绍（每个用户只发一次：首次私聊 / 首次在群被 @ 都算）。
  # dev/mock 默认关闭，避免测试用例被多一条问候干扰；生产在 cloud/deploy 配置里启用。
  self_intro: ""

session:
  context_max_turns: 10
  context_ttl_seconds: 604800
  group_share_context: false

qa:
  auto_numeric: true

# ---------- 上传行为（05 §6.5）----------
upload:
  chunk_size_mb: 8            # 分片大小；界面按它切片
  concurrent: 3               # 同一时刻上传几个文件（界面可临时调小）
  max_retry: 3                # 失败分片指数退避重试次数

limits:
  global_qps: 20
  per_user_qps: 2
  per_conversation_qps: 3
  max_question_chars: 2000
  max_file_size_mb: 500
  personal_storage_mb: 1024
  file_ext_whitelist: [pdf, docx, doc, pptx, ppt, xlsx, xls, txt, md, html, png, jpg, jpeg]

security:
  allowed_file_mime:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain
    - text/markdown
    - image/png
    - image/jpeg
  sensitive_words_path: "config/sensitive_words.txt"   # 开发（生产 /opt/ekbs/etc/sensitive_words.txt）
  content_security_enabled: true
  # ---- 本机账号登录（管理台第二种登录方式；见 ekbs/local_auth.py）----
  # 日常用钉钉免登；本机账号只在「人就在服务器前 / 钉钉不可用」时兜底。
  local_login_enabled: true          # 关掉后 /auth/local-login 直接 404
  local_login_allow_remote: false    # ⚠️ 保持 false：true = 内网任何机器都能试密码（不推荐）
  local_login_max_failures: 5        # 连续失败次数上限
  local_login_lock_minutes: 15       # 达到上限后的锁定时长

# 生成后置「资料充分性」核验（默认关闭；只对 rerank 边界分调用）
# 选型见公开基准评测报告 §6.5：显式模型 deepseek-flash + reasoning_effort=high，
# 密钥从环境变量 DEEPSEEK_API_KEY 读（secrets.env），不写进本文件。
answer_verify:
  enabled: false
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-flash
  key_env: DEEPSEEK_API_KEY
  reasoning_effort: high
  max_tokens: 4000
  timeout_seconds: 180
  max_retries: 3
  min_score: 0.65
  max_score: 0.85
  max_contexts: 5
  max_context_chars: 900
  fail_open: true

# 分段索引（方案 B）开关：默认 single = 现有单文件行为；灰度时改 segmented。
# P0 只落盘格式与迁移工具，检索路径暂不切换（P1 再接活跃段/跨段归并）。
index:
  layout: single
  writer: worker
  segment:
    batch_max_vectors: 12000
    personal_max_vectors: 1
    idle_flush_seconds: 5
    compaction_max_segments: 8
    compaction_personal_min_segments: 4
