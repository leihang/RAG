[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekbs"
version = "0.1.0"
description = "EKBS 企业知识中枢 —— 部门级 RAG 试点（Python venv + launchd，无 Docker）"
requires-python = ">=3.11"
# 依赖版本口径的唯一权威是 requirements.txt（镜像 deploy/requirements.txt），
# 这里不重复声明，避免两处漂移。
dependencies = []

[tool.setuptools.packages.find]
# [修正] 原写 `packages = ["ekbs"]`，只声明顶层包 —— `pip install .` / 构建 wheel 时
# **10 个子包（api/retrieval/permission/index/ingest/provider/dingtalk/cache/tools/observability）
# 全部不会被打进去**，装完 import ekbs.api 直接 ModuleNotFoundError。
# 生产上没暴露是因为 deploy/scripts/release.sh 用的是 `pip install -e`（editable 把项目根
# 加进 sys.path，子包靠文件系统解析）。非 editable 安装/打包必须靠这条 find 规则。
include = ["ekbs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 目标版本与 .venv 保持一致（Python 3.11，见 requirements.txt 头部说明）
target-version = "py311"
line-length = 120
# 只查 Python；文档里的示例代码块按"示意"处理，不当可运行代码要求
# excel_rag_parser 是独立 pip 包（有自己的测试与配置），不纳入 EKBS 的 CI 门禁。
extend-exclude = ["*.md", "var", "var-cloud", "excel_rag_parser"]

[tool.ruff.lint]
# 已开：语法/未定义名/未使用 import·变量/重复定义 + bugbear(B) + simplify(SIM)。
# E501（行宽）、UP（pyupgrade）存量仍多，另批清理后再开。
# C901：圈复杂度棘轮（见 mccabe.max-complexity），只防新增、不追历史债。
select = ["E4", "E7", "E9", "F", "C901", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# eval/ 是一次性评测脚本，不进产品路径；B/SIM 另批清理，避免拖垮主包棘轮。
"eval/**" = ["B", "SIM"]

[tool.ruff.lint.mccabe]
# 圈复杂度棘轮：现卡 15（**目标值已达**）。retrieve/answer/_parse_×4/migrate/
# can_see_document 等 11 个巨型函数已全部拆到 ≤15；仅 handle(28) 与 eval 一次性脚本
# 以 `# noqa: C901` 显式留痕（历史债，非隐藏）。
max-complexity = 15

[tool.mypy]
# 类型检查棘轮：只检查「已类型化、当前零错误」的模块；历史模块未类型化不在此列。
# 新增/重构的模块应以零 mypy 错误为目标，并逐步加入 files 白名单。
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"        # 只看显式列出的文件，不追依赖（避免历史模块噪音）
warn_unused_ignores = false
files = [
    "ekbs/config.py",
    "ekbs/errors.py",
    "ekbs/db.py",
    "ekbs/retrieval/intent.py",
    "ekbs/retrieval/rrf.py",
]

[tool.coverage.run]
# 覆盖率门禁只统计 ekbs/ 主包（excel_rag_parser 是独立包，不在 EKBS CI 内）。
source = ["ekbs"]
branch = false

[tool.coverage.report]
# 覆盖率棘轮：只防退步，不追高。全量基线 81%（19440 语句），留 3pp 缓冲吸收
# 环境差异 / 可选依赖跳过用例。改用例后如需上调，先跑 `bash scripts/ci.sh --coverage` 看实际值。
fail_under = 78
show_missing = true
skip_covered = false
